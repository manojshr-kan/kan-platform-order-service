spring:
  application:
    name: order-service

  # Startup config from AWS (IRSA supplies credentials):
  #  - Secrets Manager: app secrets (optional until populated)
  #  - Parameter Store: shared platform config, incl. the Cognito issuer.
  #    Terraform rewrites these on every apply, so no value is hardcoded.
  config:
    import:
      - "optional:aws-secretsmanager:order-service/config"
      - "aws-parameterstore:/kan-cloud-platform/dev/"

  security:
    oauth2:
      resourceserver:
        jwt:
          # Sourced from SSM param /kan-cloud-platform/dev/cognito.issuer-uri
          issuer-uri: ${cognito.issuer-uri}

  cloud:
    aws:
      # Explicit region so the Parameter Store / Secrets Manager clients resolve
      # the right region at the early config-import phase (env resolution there
      # is unreliable — caused parameterstore "does not exist").
      region:
        static: ap-south-1
      sqs:
        # The queue is provisioned by Terraform. Never let the app create it
        # (it has no CreateQueue permission by design). Fail loudly if missing.
        queue-not-found-strategy: fail

app:
  queue-name: order-service-queue

# Probes used by Kubernetes readiness/liveness
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
